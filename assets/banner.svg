<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Amito Releases: official downloads for Amito apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1226"/>
      <stop offset="0.55" stop-color="#171B45"/>
      <stop offset="1" stop-color="#1D2A5A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#5458F0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5458F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="1" r="0.5">
      <stop offset="0" stop-color="#34D3B6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#34D3B6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="320" rx="28"/></clipPath>
    <clipPath id="disc"><circle cx="1030" cy="160" r="66"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect width="1280" height="320" fill="url(#glow2)"/>

    <!-- faint thread lanes -->
    <g stroke-linecap="round" stroke-width="6" opacity="0.18">
      <line x1="80" y1="262" x2="520" y2="262" stroke="#34D3B6"/>
      <line x1="80" y1="282" x2="420" y2="282" stroke="#5458F0"/>
      <line x1="80" y1="242" x2="610" y2="242" stroke="#FFC857"/>
    </g>

    <!-- ADM-style mark -->
    <circle cx="1030" cy="160" r="92" fill="none" stroke="#1F9E8C" stroke-width="10" opacity="0.35"/>
    <circle cx="1030" cy="160" r="92" fill="none" stroke="#34D3B6" stroke-width="10" stroke-linecap="round" stroke-dasharray="433.5 578" transform="rotate(-90 1030 160)"/>
    <circle cx="938" cy="160" r="8" fill="#FFC857"/>
    <circle cx="1030" cy="160" r="66" fill="#3B3FD8"/>
    <g clip-path="url(#disc)"><circle cx="1005" cy="134" r="66" fill="#5458F0"/></g>
    <line x1="1030" y1="122" x2="1030" y2="173" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <polyline points="1007,151 1030,174 1053,151" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1005" y1="195" x2="1055" y2="195" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>

    <!-- text -->
    <text x="80" y="128" fill="#8E97C8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4">OFFICIAL DOWNLOADS</text>
    <text x="78" y="190" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800">Amito <tspan fill="#34D3B6">Releases</tspan></text>
    <text x="80" y="226" fill="#B9C0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">Installers for every Amito app, built and published automatically.</text>
  </g>
</svg>
